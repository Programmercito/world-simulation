<main class="app-shell">
  <app-landing (createWorld)="onCreateWorld($event)"></app-landing>

  @if (simulationStarted()) {
    <section class="world-section" id="world">
      <app-world-view
        [config]="worldConfig()"
        (createWorld)="onCreateWorld($event)"
      ></app-world-view>
    </section>
  }

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-mark" aria-hidden="true">✦</span>
        <span>WORLD <strong>SIMULATION</strong></span>
      </div>
      <p class="footer-credit">
        Hecho con <span role="img" aria-label="amor">♥</span> por <strong>Devcito</strong>
      </p>
      <span class="footer-caption">UN PEQUEÑO UNIVERSO DIGITAL</span>
    </div>
  </footer>
</main>
<router-outlet />
